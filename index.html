<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4×4 卡诺图 — Q₃Q₂Q₁Q₀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tab-bar" id="tabBar">
  <div class="tab active" data-idx="0"><span>卡诺图 1</span><button class="tab-close" title="关闭">×</button></div>
  <button class="tab-add" id="tabAdd" title="新建卡诺图">+</button>
</div>

<div class="main">
  <div class="left-panel" id="leftPanel"></div>

  <div class="right-panel">
    <div class="card">
      <h3>操作模式</h3>
      <div class="mode-switch" id="modeSwitch">
        <button class="mode-btn active" data-mode="edit">✏️ 编辑取值</button>
        <button class="mode-btn" data-mode="group">🖊️ 手动圈选</button>
      </div>
      <div class="caption" id="modeHint">点击格子切换 0 → 1 → X → 0</div>
    </div>

    <div class="card">
      <h3>表达式（KaTeX 渲染）</h3>
      <div class="katex-display" id="katexDisplay">
        <span class="katex-placeholder">点击自动化简或输入表达式</span>
      </div>
      <div class="expr-box" id="exprBox" onclick="document.getElementById('exprText').focus()">
        <span class="expr-text" id="exprText" contenteditable="true"></span>
      </div>
      <div class="btn-row">
        <button class="btn btn-action" id="btnAutoSimplify">⚡ 自动化简</button>
        <button class="btn btn-secondary" id="btnClearGroups">清除圈选</button>
        <button class="btn btn-secondary" id="btnClearAll">清空全部</button>
      </div>
    </div>

    <div class="card">
      <h3>表达式输入</h3>
      <div class="btn-row" style="margin-top:0">
        <button class="btn btn-var ins-btn" data-text="Q3">Q₃</button>
        <button class="btn btn-var ins-btn" data-text="Q2">Q₂</button>
        <button class="btn btn-var ins-btn" data-text="Q1">Q₁</button>
        <button class="btn btn-var ins-btn" data-text="Q0">Q₀</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-not ins-btn" data-text="'">NOT &nbsp;◌̅</button>
        <button class="btn btn-op ins-btn" data-text="·">AND ·</button>
        <button class="btn btn-op ins-btn" data-text="+">OR &nbsp;+</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-paren ins-btn" data-text="(">(</button>
        <button class="btn btn-paren ins-btn" data-text=")">)</button>
        <button class="btn btn-secondary" id="btnBackspace">⌫ 退格</button>
        <button class="btn btn-secondary" id="btnClearExpr">清空</button>
      </div>
    </div>

    <div class="card">
      <h3>当前圈选 (<span id="groupCount">0</span>)</h3>
      <div id="groupList" style="max-height:200px;overflow-y:auto"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="script.js"></script>
</body>
</html>
